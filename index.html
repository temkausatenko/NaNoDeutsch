<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0c12">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="sync.js"></script>
<style>
  :root {
    --bg: #0a0c12;
    --surface: rgba(255, 255, 255, 0.045);
    --surface-hover: rgba(255, 255, 255, 0.075);
    --border: rgba(255, 255, 255, 0.09);
    --text: #f4f1ea;
    --muted: rgba(244, 241, 234, 0.55);
    --gold: #e8c98a;
    --gold-deep: #b98a3e;
    --accent-a: #7c8cff;
    --accent-b: #c77dff;
    --accent-c: #ff9a8b;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: calc(28px + env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom));
    position: relative;
    overflow-x: hidden;
  }

  /* Атмосферное свечение на фоне */
  .glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.5;
    pointer-events: none;
    z-index: 0;
  }
  .glow.g1 {
    width: 300px; height: 300px;
    top: -110px; right: -90px;
    background: radial-gradient(circle, var(--accent-b) 0%, transparent 70%);
    animation: drift 14s ease-in-out infinite alternate;
  }
  .glow.g2 {
    width: 280px; height: 280px;
    bottom: -100px; left: -100px;
    background: radial-gradient(circle, var(--accent-a) 0%, transparent 70%);
    opacity: 0.4;
    animation: drift 18s ease-in-out infinite alternate-reverse;
  }

  /* Тонкая зернистость для «дорогой» текстуры */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0.035;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  .wrap { position: relative; z-index: 2; max-width: 520px; margin: 0 auto; }

  /* Шапка */
  .header { margin-bottom: 30px; animation: rise 0.8s var(--ease) both; }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 14px;
  }
  .eyebrow::before {
    content: "";
    width: 22px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold));
  }

  .header h1 {
    font-size: 40px;
    line-height: 1.05;
    font-weight: 800;
    letter-spacing: -1.2px;
    margin: 0 0 10px;
    background: linear-gradient(180deg, #ffffff 0%, #d9d3c4 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .header p {
    margin: 0;
    font-size: 15px;
    color: var(--muted);
    letter-spacing: 0.01em;
  }

  /* Список карточек */
  .list { display: flex; flex-direction: column; gap: 14px; }

  .card {
    --c1: var(--accent-a);
    --c2: var(--accent-b);
    position: relative;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px;
    border-radius: 24px;
    text-decoration: none;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.07);
    transition: transform 0.25s var(--ease), background 0.25s ease, border-color 0.25s ease;
    animation: rise 0.8s var(--ease) both;
  }
  .card:nth-child(1) { animation-delay: 0.12s; }
  .card:nth-child(2) { animation-delay: 0.22s; --c1: #ff9a8b; --c2: #c77dff; }
  .card:nth-child(3) { animation-delay: 0.32s; }
  .card:nth-child(4) { animation-delay: 0.42s; }

  /* Цветное свечение внутри карточки */
  .card::before {
    content: "";
    position: absolute;
    top: -60px; left: -40px;
    width: 180px; height: 180px;
    background: radial-gradient(circle, var(--c1) 0%, transparent 70%);
    opacity: 0.22;
    filter: blur(20px);
    transition: opacity 0.3s ease;
    pointer-events: none;
  }

  .card:active {
    transform: scale(0.97);
    background: var(--surface-hover);
    border-color: rgba(255, 255, 255, 0.16);
  }
  .card:active::before { opacity: 0.38; }

  .icon {
    position: relative;
    flex-shrink: 0;
    width: 64px; height: 64px;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
    border-radius: 20px;
    background: linear-gradient(145deg, var(--c1), var(--c2));
    box-shadow: 0 8px 22px -6px var(--c1), inset 0 1px 0 rgba(255, 255, 255, 0.4);
  }
  .icon::after {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    background: linear-gradient(160deg, rgba(255,255,255,0.35) 0%, transparent 45%);
  }
  .icon span { position: relative; z-index: 1; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25)); }

  .info { flex: 1; min-width: 0; position: relative; z-index: 1; }

  .card-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
    line-height: 1.2;
    margin: 0 0 4px;
  }

  .card-sub {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: var(--gold);
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(232, 201, 138, 0.09);
    border: 1px solid rgba(232, 201, 138, 0.22);
  }

  .arrow {
    position: relative; z-index: 1;
    flex-shrink: 0;
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid var(--border);
    transition: transform 0.25s var(--ease), background 0.25s ease;
  }
  .arrow svg { width: 16px; height: 16px; stroke: var(--text); opacity: 0.8; }
  .card:active .arrow { transform: translateX(3px); background: rgba(255,255,255,0.14); }

  /* Подвал */
  .footer {
    margin-top: 34px;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(244, 241, 234, 0.28);
    animation: rise 0.8s var(--ease) 0.55s both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(30px, 40px) scale(1.15); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

  <div class="glow g1"></div>
  <div class="glow g2"></div>

  <div class="wrap">
    <div class="header">
      <div class="eyebrow">Deutsch · Training</div>
      <h1>Тренажери</h1>
      <p>Обери тему для тренування</p>
    </div>

    <div class="list">
      <!-- Карточка 1: Temporale Präpositionen -->
      <a href="temporale-prapositionen-07-10-2026.html" class="card">
        <div class="icon"><span>⏱️</span></div>
        <div class="info">
          <h2 class="card-title">Temporale Präpositionen</h2>
          <div class="card-sub">Часові прийменники</div>
          <span class="chip">📅 07.10.2026</span>
        </div>
        <div class="arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </div>
      </a>

      <!-- Карточка 2: Alle Konnektoren -->
      <a href="alle-konnektoren-30-09-2026.html" class="card">
        <div class="icon"><span>🔗</span></div>
        <div class="info">
          <h2 class="card-title">Konnektoren Meister</h2>
          <div class="card-sub">Всі коннектори</div>
          <span class="chip">📅 30.09.2026</span>
        </div>
        <div class="arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </div>
      </a>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Разворачиваем на весь экран
    tg.ready();  // Сообщаем Telegram, что приложение готово

    // Подгоняем цвета Telegram под дизайн
    try {
      tg.setHeaderColor('#0a0c12');
      tg.setBackgroundColor('#0a0c12');
    } catch (e) {}

    // Лёгкая вибрация при нажатии на карточку
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('touchstart', () => {
        try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
      }, { passive: true });
    });
  </script>
</body>
</html>
