<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="sync.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    --pr: #6366f1;
    --pr-glow: rgba(99, 102, 241, 0.2);
    --ok: #10b981;
    --go: #f59e0b;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--bg);
    color: #f0f6fc;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    min-height: 100vh;
  }

  /* --- Блок общего прогресса --- */
  .global-progress {
    max-width: 800px;
    margin: 0 auto 20px;
    padding: 14px 18px;
    background: #161b22;
    border: 1px solid #21262d;
    border-radius: 16px;
    animation: fadeIn 0.6s var(--ease) both;
  }
  .gp-header {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: #8b949e;
    margin-bottom: 10px;
    font-weight: 600;
  }
  #gp-percent {
    color: #f0f6fc;
    font-size: 16px;
    font-weight: 800;
  }
  .gp-bar {
    height: 10px;
    background: #21262d;
    border-radius: 99px;
    overflow: hidden;
  }
  .gp-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--pr), #a78bfa);
    border-radius: 99px;
    transition: width 0.8s var(--ease);
  }

  /* Сетка для карточек-картинок */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    animation: fadeIn 0.6s var(--ease) both;
  }

  @media (min-width: 600px) {
    .grid {
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      max-width: 800px;
      margin: 0 auto;
    }
  }

  .card {
    display: block;
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    transition: transform 0.15s var(--ease);
    background: #1a202c;
    aspect-ratio: 1 / 1;
  }

  .card:active {
    transform: scale(0.95);
  }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* --- Бейджи на карточках --- */
  .badge {
    position: absolute;
    bottom: 10px;
    right: 10px;
    padding: 4px 10px;
    border-radius: 8px;
    background: rgba(13, 17, 23, 0.85);
    color: #8b949e;
    font-size: 11px;
    font-weight: 800;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    pointer-events: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  .badge.done { color: var(--ok); border-color: rgba(16, 185, 129, 0.4); }
  .badge.half { color: var(--go); border-color: rgba(245, 158, 11, 0.4); }
  .badge.started { color: #f0f6fc; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

  <!-- Общий прогресс -->
  <div class="global-progress">

      <span>Загальний прогрес</span>

  <div class="grid">

  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    
    try {
      tg.setHeaderColor('#0d1117');
      tg.setBackgroundColor('#0d1117');
    } catch (e) {}

    // Легкая вибрация при нажатии на карточку
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('touchstart', () => {
        try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
      }, { passive: true });
    });

    // --- ЛОГИКА ОБНОВЛЕНИЯ ПРОГРЕССА ---
    function updateProgress() {
      const badges = document.querySelectorAll('.badge');
      let totalPct = 0;
      let activeCount = 0; // Считаем среднее только по тем тренажерам, где есть прогресс > 0

      badges.forEach(badge => {
        const key = badge.getAttribute('data-track');
        const val = parseInt(localStorage.getItem(key) || '-1', 10);
        
        if (val >= 0) {
          badge.textContent = val + '%';
          badge.classList.remove('started', 'half', 'done');
          
          if (val >= 100) badge.classList.add('done');
          else if (val >= 50) badge.classList.add('half');
          else if (val > 0) badge.classList.add('started');
          
          totalPct += val;
          activeCount++;
        } else {
          badge.textContent = '—';
          badge.classList.remove('started', 'half', 'done');
        }
      });

      const avg = activeCount > 0 ? Math.round(totalPct / activeCount) : 0;
      
      const gpPercent = document.getElementById('gp-percent');
      const gpFill = document.getElementById('gp-fill');
      
      if (gpPercent) gpPercent.textContent = avg + '%';
      if (gpFill) gpFill.style.width = avg + '%';
    }

    // Запускаем при загрузке
    updateProgress();

    // Обновляем, когда пользователь возвращается с тренажера
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) updateProgress();
    });
    window.addEventListener('focus', updateProgress);
    
    // Слушаем событие синхронизации от sync.js (когда данные пришли из облака)
    window.addEventListener('tpsync:updated', updateProgress);
  </script>
</body>
