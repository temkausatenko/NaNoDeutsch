<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="sync.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    --ok: #10b981;
    --no: #ef4444;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--bg);
    color: #f0f6fc;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    min-height: 100vh;
  }

  /* Сетка для карточек-картинок */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr); /* 2 колонки на телефонах */
    gap: 12px;
    animation: fadeIn 0.6s var(--ease) both;
  }

  /* На больших экранах (планшетах и ПК) делаем 3 колонки */
  @media (min-width: 600px) {
    .grid {
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      max-width: 800px;
      margin: 0 auto;
    }
  }

  .card {
    display: block;
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    /* Толщина и прозрачность рамки */
    border: 3px solid transparent; 
    /* Магия градиентной рамки */
    background: linear-gradient(#1a202c, #1a202c) padding-box, 
                linear-gradient(#1a202c, #1a202c) border-box;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    transition: transform 0.15s var(--ease), box-shadow 0.3s ease, background 0.3s ease;
    aspect-ratio: 1 / 1;
  }

  .card:active {
    transform: scale(0.95);
  }

  /* Сама картинка (радиус меньше, чтобы вписаться в рамку) */
  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover; 
    display: block;
    border-radius: 13px; /* 16 - 3 = 13 */
  }

  /* --- Премиальная красная обводка (в процессе) --- */
  .card.red-border {
    background: linear-gradient(#1a202c, #1a202c) padding-box, 
                linear-gradient(135deg, #ff416c, #ff4b2b) border-box;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4), 
                0 0 15px rgba(255, 65, 108, 0.3); /* Мягкое свечение */
  }

  /* --- Премиальная зеленая обводка (100% завершено) --- */
  .card.green-border {
    background: linear-gradient(#1a202c, #1a202c) padding-box, 
                linear-gradient(135deg, #00b09b, #96c93d) border-box;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4), 
                0 0 20px rgba(0, 176, 155, 0.4); /* Более яркое свечение */
  }

  /* --- Бейдж с процентами --- */
  .badge {
    position: absolute;
    bottom: 10px;
    right: 10px;
    padding: 4px 10px;
    border-radius: 8px;
    background: rgba(13, 17, 23, 0.85);
    color: #8b949e;
    font-size: 11px;
    font-weight: 800;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    pointer-events: none; /* Чтобы клик проходил на карточку */
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  .badge.done { color: var(--ok); border-color: rgba(16, 185, 129, 0.4); }
  .badge.half { color: #f59e0b; border-color: rgba(245, 158, 11, 0.4); }
  .badge.started { color: #f0f6fc; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

  <div class="grid">

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    
    try {
      tg.setHeaderColor('#0d1117');
      tg.setBackgroundColor('#0d1117');
    } catch (e) {}

    // Легкая вибрация при нажатии на карточку
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('touchstart', () => {
        try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
      }, { passive: true });
    });

    // --- ЛОГИКА ОБНОВЛЕНИЯ ПРОГРЕССА (НА ОСНОВЕ EXP) ---
    function updateProgress() {
      const badges = document.querySelectorAll('.badge');

      badges.forEach(badge => {
        const trainerId = badge.getAttribute('data-id'); // получаем 'tekamolo', 'negation' и т.д.
        
        // Читаем EXP и МАКС EXP из localStorage
        const exp = parseInt(localStorage.getItem('tp_v2_exp_' + trainerId) || '0', 10);
        const expMax = parseInt(localStorage.getItem('tp_v2_exp_max_' + trainerId) || '0', 10);
        
        // Считаем процент
        let val = -1; // -1 значит "нет данных"
        if (expMax > 0) {
          val = Math.round((exp / expMax) * 100);
          if (val > 100) val = 100; // Защита
        }
        
        // Обновляем бейдж
        if (val >= 0) {
          badge.textContent = val + '%';
          badge.classList.remove('started', 'half', 'done');
          if (val >= 100) badge.classList.add('done');
          else if (val >= 50) badge.classList.add('half');
          else if (val > 0) badge.classList.add('started');
        } else {
          badge.textContent = '—';
          badge.classList.remove('started', 'half', 'done');
        }

        // Обновляем обводку карточки
        const card = badge.closest('.card');
        if (card) {
          card.classList.remove('red-border', 'green-border');
          
          if (val >= 100) {
            card.classList.add('green-border'); // Максимум достигнут
          } else if (exp > 0) {
            card.classList.add('red-border');   // Есть прогресс, но не 100%
          }
        }
      });
    }

    // Запускаем при загрузке
    updateProgress();

    // Обновляем, когда пользователь возвращается с тренажера
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) updateProgress();
    });
    window.addEventListener('focus', updateProgress);
    
    // Слушаем событие синхронизации от sync.js
    window.addEventListener('tpsync:updated', updateProgress);
  </script>
