<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="sync.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    --ok: #10b981;
    --no: #ef4444;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--bg);
    color: #f0f6fc;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    min-height: 100vh;
  }

  /* Сетка для карточек-картинок */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr); /* 2 колонки на телефонах */
    gap: 12px;
    animation: fadeIn 0.6s var(--ease) both;
  }

  /* На больших экранах (планшетах и ПК) делаем 3 колонки */
  @media (min-width: 600px) {
    .grid {
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      max-width: 800px;
      margin: 0 auto;
    }
  }

  @property --a { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  @property --h { syntax: '<angle>'; initial-value: 0deg; inherits: false; }

  .card {
    display: block;
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    border: 3px solid transparent;
    aspect-ratio: 1 / 1;
    --p: 0;
    --c1: #ff4b6e;
    --c2: #ff8a5b;
    --glow: rgba(255, 90, 100, 0.35);
    /* внутри - картинка, снаружи - рамка-прогресс по периметру */
    background:
      linear-gradient(#1a202c, #1a202c) padding-box,
      conic-gradient(from 0deg,
        var(--c1) 0%,
        var(--c2) calc(var(--p) * 1%),
        rgba(255, 255, 255, 0.08) calc(var(--p) * 1%)) border-box;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    transition: transform 0.15s var(--ease), box-shadow 0.3s ease;
  }

  .card:active { transform: scale(0.95); }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 13px;
  }

  /* В процессе: мягкое фиолетовое свечение */
  .card.prog {
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4), 0 0 16px var(--glow);
  }

  /* 100%: вращающаяся золотая рамка */
  .card.done {
    background:
      linear-gradient(#1a202c, #1a202c) padding-box,
      conic-gradient(from var(--a), #ffd86b, #ff9a3c, #fff3b0, #ffb347, #ffd86b) border-box;
    animation: spin 4s linear infinite;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4), 0 0 22px rgba(255, 190, 70, 0.4);
  }

  @keyframes spin { to { --a: 360deg; } }

  /* --- Голографический эффект для 100% --- */
  .card.done::before,
  .card.done::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 13px;
    pointer-events: none;
    z-index: 2;
  }
  /* Мягкое радужное мерцание: плавно вращается без рывков */
  .card.done::before {
    background: conic-gradient(from var(--h) at 50% 50%,
      rgba(255, 90, 170, 0.16),
      rgba(90, 200, 255, 0.16),
      rgba(255, 225, 110, 0.16),
      rgba(130, 255, 190, 0.16),
      rgba(255, 90, 170, 0.16));
    mix-blend-mode: screen;
    opacity: 0.85;
    animation: holoSpin 9s linear infinite;
  }
  /* Широкий мягкий блик, проплывающий по карточке */
  .card.done::after {
    background: linear-gradient(115deg,
      transparent 30%,
      rgba(255, 255, 255, 0.05) 38%,
      rgba(120, 220, 255, 0.16) 44%,
      rgba(255, 255, 255, 0.24) 50%,
      rgba(255, 150, 230, 0.16) 56%,
      rgba(255, 230, 140, 0.08) 62%,
      transparent 70%);
    background-size: 300% 100%;
    background-position: 120% 0;
    mix-blend-mode: screen;
    animation: holoSweep 6s cubic-bezier(0.45, 0, 0.55, 1) infinite;
  }

  @keyframes holoSpin { to { --h: 360deg; } }
  @keyframes holoSweep {
    0%   { background-position: 120% 0; }
    55%  { background-position: -20% 0; }
    100% { background-position: -20% 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .card.done, .card.done::before, .card.done::after { animation: none; }
  }


  /* --- Бейдж справа снизу --- */
  .badge {
    position: absolute;
    right: 8px;
    bottom: 8px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: rgba(13, 17, 23, 0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #f0f6fc;
    font-size: 10.5px;
    font-weight: 800;
    pointer-events: none;
    z-index: 3;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
  }

  .badge svg.ring {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }
  .badge svg.ring circle { fill: none; stroke-width: 3; stroke-linecap: round; }
  .badge svg.ring .tr { stroke: rgba(255, 255, 255, 0.12); }
  .badge svg.ring .fg {
    stroke: var(--c2);
    stroke-dasharray: 100;
    stroke-dashoffset: calc(100 - var(--p));
    filter: drop-shadow(0 0 3px var(--glow));
    transition: stroke-dashoffset 1s var(--ease);
  }
  .badge .num { position: relative; }

  /* Новый тренажёр */
  .badge.neu {
    width: auto;
    height: auto;
    border-radius: 99px;
    padding: 5px 11px;
    color: #22d3ee;
    letter-spacing: 0.8px;
    border: 1px solid rgba(34, 211, 238, 0.4);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35), 0 0 10px rgba(34, 211, 238, 0.25);
  }

  /* 100%: золотой круг с галочкой */
  .badge.done svg.ring .fg {
    stroke: url(#gGold);
    filter: drop-shadow(0 0 4px rgba(255, 200, 80, 0.9));
  }
  .badge .ck {
    position: relative;
    width: 18px;
    height: 18px;
    fill: none;
    stroke: #ffd666;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 3px rgba(255, 200, 80, 0.8));
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <div class="grid">

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    
    try {
      tg.setHeaderColor('#0d1117');
      tg.setBackgroundColor('#0d1117');
    } catch (e) {}

    // Легкая вибрация при нажатии на карточку
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('touchstart', () => {
        try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
      }, { passive: true });
    });

    // --- ЛОГИКА ОБНОВЛЕНИЯ ПРОГРЕССА (НА ОСНОВЕ EXP) ---
    const RING = '<svg class="ring" viewBox="0 0 42 42"><circle class="tr" cx="21" cy="21" r="18" pathLength="100"/><circle class="fg" cx="21" cy="21" r="18" pathLength="100"/></svg>';
    const CHECK = '<svg class="ck" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

    // Цвета по уровням прогресса: до 25 / до 50 / до 75 / до 99, на 100 - золото (в CSS)
    const TIERS = [
      { max: 25, c1: '#ff4b6e', c2: '#ff8a5b', glow: 'rgba(255, 90, 100, 0.35)' },
      { max: 50, c1: '#a855f7', c2: '#ec4899', glow: 'rgba(168, 85, 247, 0.35)' },
      { max: 75, c1: '#3b82f6', c2: '#22d3ee', glow: 'rgba(34, 211, 238, 0.35)' },
      { max: 99, c1: '#10b981', c2: '#84e36b', glow: 'rgba(16, 185, 129, 0.38)' }
    ];
    function computeExpFromState(trainerId) {
      let totalX = 0, totalP = 0;
      const prefix = 'tp_v2_' + trainerId + '_';
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(prefix)) {
          try {
            const val = JSON.parse(localStorage.getItem(k));
            if (val && typeof val === 'object') {
              totalX += Number(val.x) || 0;
              totalP += Number(val.p) || 0;
            }
          } catch(e) {}
        }
      }
      return Math.max(0, totalX - totalP);
    }

    function updateProgress() {
      document.querySelectorAll('.badge').forEach(badge => {
        const trainerId = badge.getAttribute('data-id');
        const card = badge.closest('.card');

        // EXP считаем из реального состояния вкладок (tp_v2_<id>_*), а не из залипшего tp_v2_exp_<id>
        const exp = computeExpFromState(trainerId);
        const expMax = parseInt(localStorage.getItem('tp_v2_exp_max_' + trainerId) || '0', 10);

        let val = 0;
        if (expMax > 0) {
          val = Math.round((exp / expMax) * 100);
          if (val > 100) val = 100;
          if (val < 0) val = 0;
        }

        badge.classList.remove('neu', 'done');
        card.classList.remove('prog', 'done');
        card.style.setProperty('--p', val);
        badge.style.setProperty('--p', val);

        if (val <= 0) {
          badge.classList.add('neu');
          badge.innerHTML = 'NEU';
        } else if (val >= 100) {
          badge.classList.add('done');
          card.classList.add('done');
          badge.innerHTML = RING + CHECK;
        } else {
          card.classList.add('prog');
          const t = TIERS.find(x => val <= x.max) || TIERS[TIERS.length - 1];
          card.style.setProperty('--c1', t.c1);
          card.style.setProperty('--c2', t.c2);
          card.style.setProperty('--glow', t.glow);
          badge.innerHTML = RING + '<span class="num">' + val + '%</span>';
        }
      });
    }

    // Запускаем при загрузке
    updateProgress();

    // Обновляем, когда пользователь возвращается с тренажера
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) updateProgress();
    });
    window.addEventListener('focus', updateProgress);
    
    // Слушаем событие синхронизации от sync.js
    window.addEventListener('tpsync:updated', updateProgress);
  </script>
</body>
