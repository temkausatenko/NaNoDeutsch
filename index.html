<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="sync.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--bg);
    color: #f0f6fc;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    min-height: 100vh;
  }

  /* Сетка для карточек-картинок */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr); /* 2 колонки на телефонах */
    gap: 12px;
    animation: fadeIn 0.6s var(--ease) both;
  }

  /* На больших экранах (планшетах и ПК) делаем 3 колонки */
  @media (min-width: 600px) {
    .grid {
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      max-width: 800px;
      margin: 0 auto;
    }
  }

  .card {
    display: block;
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    transition: transform 0.15s var(--ease);
    background: #1a202c;
    aspect-ratio: 1 / 1; /* Идеальный квадрат */
  }

  .card:active {
    transform: scale(0.95); /* Эффект нажатия */
  }

  /* Сама картинка */
  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* Заполняет весь квадрат без искажений */
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

  <div class="grid">

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    
    try {
      tg.setHeaderColor('#0d1117');
      tg.setBackgroundColor('#0d1117');
    } catch (e) {}

    // Легкая вибрация при нажатии на карточку
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('touchstart', () => {
        try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
      }, { passive: true });
    });
