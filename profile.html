<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Профіль</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="sync.js"></script>
<style>
  :root {
    --bg-color: var(--tg-theme-bg-color, #ffffff);
    --text-color: var(--tg-theme-text-color, #000000);
    --hint-color: var(--tg-theme-hint-color, #999999);
    --card-bg: var(--tg-theme-secondary-bg-color, #f1f1f1);
    --btn-color: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --danger: var(--tg-theme-destructive-text-color, #ef4444);
    --nav-h: 70px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    margin: 0;
    padding: 20px 20px calc(var(--nav-h) + var(--safe-bottom) + 20px) 20px;
    transition: background-color 0.3s, color 0.3s;
  }

  /* ---------- Шапка профілю ---------- */
  .profile-header { display: flex; align-items: center; gap: 15px; margin-bottom: 24px; }
  .avatar {
    width: 70px; height: 70px; border-radius: 50%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; color: #fff; font-weight: bold; overflow: hidden; flex-shrink: 0;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .user-info { min-width: 0; }
  .user-info h2 { margin: 0 0 4px 0; font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-info p { margin: 0; color: var(--hint-color); font-size: 14px; }

  /* ---------- Синхронізація ---------- */
  .sync-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: -8px 0 16px 0; font-size: 12px; color: var(--hint-color); }
  .sync-row button { background: var(--card-bg); color: var(--text-color); border: none; border-radius: 10px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .sync-row button:active { opacity: 0.6; }

  /* ---------- Рівень ---------- */
  .level-card { background-color: var(--card-bg); border-radius: 16px; padding: 18px 20px; margin-bottom: 15px; }
  .level-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .level-top .lvl { font-size: 18px; font-weight: 800; }
  .level-top .xp { font-size: 14px; color: var(--hint-color); }
  .bar { height: 10px; border-radius: 6px; background: rgba(128, 128, 128, 0.2); overflow: hidden; }
  .bar > div { height: 100%; width: 0; border-radius: 6px; background: var(--btn-color); transition: width 0.6s ease; }
  .level-sub { margin-top: 8px; font-size: 12px; color: var(--hint-color); }

  /* ---------- Плитки ---------- */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
  .tile { background-color: var(--card-bg); border-radius: 16px; padding: 16px; }
  .tile .label { font-size: 13px; color: var(--hint-color); margin-bottom: 6px; }
  .tile .value { font-size: 24px; font-weight: 800; color: var(--btn-color); }
  .tile .value small { font-size: 14px; font-weight: 600; color: var(--hint-color); }
  .tile .bar { margin-top: 10px; height: 6px; }

  /* ---------- Секції ---------- */
  .section-title { margin: 24px 0 10px 4px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--hint-color); }
  .stat-card { background-color: var(--card-bg); border-radius: 16px; padding: 16px 20px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .stat-card h3 { margin: 0; font-size: 16px; font-weight: 600; }
  .stat-card span { font-size: 18px; font-weight: 800; color: var(--btn-color); white-space: nowrap; }
  .empty { color: var(--hint-color); font-size: 14px; padding: 4px; }

  /* ---------- Досягнення ---------- */
  .badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .badge { background-color: var(--card-bg); border-radius: 16px; padding: 14px 6px; text-align: center; font-size: 11px; line-height: 1.3; color: var(--hint-color); opacity: 0.5; filter: grayscale(1); transition: opacity 0.3s, filter 0.3s; }
  .badge .ico { font-size: 26px; margin-bottom: 6px; display: block; }
  .badge.on { opacity: 1; filter: none; color: var(--text-color); }

  /* ---------- Небезпечна зона ---------- */
  .danger-btn { width: 100%; padding: 15px; background-color: transparent; color: var(--danger); border: 1px solid var(--danger); border-radius: 12px; font-size: 16px; font-weight: 600; margin-top: 28px; cursor: pointer; transition: background 0.2s; }
  .danger-btn:active { background-color: rgba(239, 68, 68, 0.1); }

  /* ---------- Нижнє меню ---------- */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: calc(var(--nav-h) + var(--safe-bottom)); padding-bottom: var(--safe-bottom);
    background-color: var(--bg-color); border-top: 1px solid rgba(128, 128, 128, 0.15);
    display: flex; justify-content: space-around; align-items: center;
  }
  .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--hint-color); text-decoration: none; font-size: 10px; font-weight: 600; gap: 4px; min-width: 70px; }
  .nav-item.active { color: var(--btn-color); }
  .nav-item svg { width: 24px; height: 24px; fill: currentColor; }
</style>
</head>
<body>

  <header class="profile-header">
    <div class="avatar" id="user-avatar" aria-hidden="true">👤</div>
    <div class="user-info">
      <h2 id="user-name">Привіт!</h2>
      <p>Вивчаємо німецьку 🇩🇪</p>
    </div>
  </header>

  <div class="sync-row">
    <span id="sync-status" role="status">⏳ Синхронізація…</span>
    <button type="button" id="sync-btn" aria-label="Синхронізувати зараз">🔄 Оновити</button>
  </div>

  <!-- Рівень -->
  <section class="level-card" aria-label="Рівень">
    <div class="level-top">
      <span class="lvl" id="level-label">Рівень 1</span>
      <span class="xp" id="level-xp">0 / 50 XP</span>
    </div>
    <div class="bar"><div id="level-bar"></div></div>
    <div class="level-sub" id="level-sub">До наступного рівня: 50 XP</div>
  </section>

  <!-- Плитки: загальний XP, серія, ціль -->
  <div class="grid">
    <div class="tile">
      <div class="label">Загальний досвід</div>
      <div class="value" id="total-xp">0</div>
    </div>
    <div class="tile">
      <div class="label">Серія днів 🔥</div>
      <div class="value"><span id="streak">0</span> <small id="streak-unit">днів</small></div>
    </div>
    <div class="tile" style="grid-column: 1 / -1;">
      <div class="label">Ціль на сьогодні</div>
      <div class="value"><span id="today-xp">0</span> <small>/ <span id="goal-xp">50</span> XP</small></div>
      <div class="bar"><div id="goal-bar"></div></div>
    </div>
  </div>

  <!-- Тренажери -->
  <div class="section-title">Тренажери</div>
  <div id="trainers"></div>

  <!-- Досягнення -->
  <div class="section-title">Досягнення</div>
  <div class="badges" id="badges"></div>

  <button type="button" class="danger-btn" id="reset-btn">🗑 Очистити весь прогрес</button>

  <!-- Нижнє меню -->
  <nav class="bottom-nav" aria-label="Навігація">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16v-2H4v2zm0-4h16v-2H4v2zm0-4h16v-2H4v2zm0-6v2h16V5H4z"/></svg>
      <span>Бібліотека</span>
    </a>
    <a href="profile.html" class="nav-item active" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>Профіль</span>
    </a>
  </nav>

  <script>
    const PREFIX = 'tp_v2_';
    const PROFILE_KEY = PREFIX + 'profile';
    const ACTIVITY_KEY = PREFIX + 'activity';
    const SERVICE_KEYS = [PROFILE_KEY, ACTIVITY_KEY];
    const DAILY_GOAL = 50;
    const XP_PER_LEVEL_BASE = 50;

    // === ДОБАВЛЕНЫ НАЗВАНИЯ ДЛЯ НОВОГО ТРЕНАЖЕРА ===
    const TRAINER_NAMES = {
      [PREFIX + 'insert']: '✍️ Вставити слово',
      [PREFIX + 'translate']: '🔤 Переклад',
      [PREFIX + 'konnektoren_pos0']: '🔗 Konnektoren: Pos 0',
      [PREFIX + 'konnektoren_pos1']: '🔗 Konnektoren: Pos 1',
      [PREFIX + 'konnektoren_nebensatz']: '🔗 Konnektoren: Nebensatz',
      [PREFIX + 'konnektoren_indirekt']: '🔗 Konnektoren: Indirekt',
      [PREFIX + 'konnektoren_doppel']: '🔗 Konnektoren: Doppel',
      [PREFIX + 'konnektoren_jedesto']: '🔗 Konnektoren: Je...desto',
      [PREFIX + 'konnektoren_temporal']: '🔗 Konnektoren: Temporal',
      [PREFIX + 'konnektoren_kausal']: '🔗 Konnektoren: Kausal',
      [PREFIX + 'konnektoren_modal']: '🔗 Konnektoren: Modal'
    };

    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready(); tg.expand(); tg.BackButton.hide();
      try { tg.setHeaderColor('bg_color'); } catch (e) {}
      tg.onEvent('themeChanged', () => { try { tg.setHeaderColor('bg_color'); } catch (e) {} });
    }

    function readJSON(key, fallback) {
      try { const raw = localStorage.getItem(key); if (!raw) return fallback; const parsed = JSON.parse(raw); return (parsed && typeof parsed === 'object') ? parsed : fallback; } catch (e) { return fallback; }
    }
    function writeJSON(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }
    function dateKey(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
    function fmt(n) { return Number(n).toLocaleString('uk-UA'); }
    function pluralDays(n) { const a = Math.abs(n) % 100, b = a % 10; if (a > 10 && a < 20) return 'днів'; if (b === 1) return 'день'; if (b >= 2 && b <= 4) return 'дні'; return 'днів'; }
    function haptic(type) { try { tg && tg.HapticFeedback.notificationOccurred(type); } catch (e) {} }

    function renderUser() {
      const avatar = document.getElementById('user-avatar');
      const user = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
      if (!user) return;
      document.getElementById('user-name').textContent = user.first_name || 'Привіт!';
      if (user.photo_url) {
        const img = document.createElement('img'); img.alt = ''; img.src = user.photo_url;
        img.onerror = () => { avatar.textContent = (user.first_name || '?').charAt(0).toUpperCase(); };
        avatar.textContent = ''; avatar.appendChild(img);
      } else {
        avatar.textContent = (user.first_name || '?').charAt(0).toUpperCase();
      }
    }

    function collectTrainers() {
      const list = []; const keys = Object.keys(localStorage);
      for (let i = 0; i < keys.length; i++) {
        const key = keys[i];
        if (!key || !key.startsWith(PREFIX) || SERVICE_KEYS.includes(key)) continue;
        const data = readJSON(key, {}); const xp = Number(data.x) || 0;
        list.push({ key, name: TRAINER_NAMES[key] || ('📘 ' + key.slice(PREFIX.length)), xp });
      }
      list.sort((a, b) => b.xp - a.xp); return list;
    }

    function updateActivity(totalXP) {
      const today = dateKey(new Date());
      const profile = readJSON(PROFILE_KEY, {});
      const activity = readJSON(ACTIVITY_KEY, {});
      const last = Number(profile.lastXP);
      if (Number.isFinite(last) && totalXP > last) {
        activity[today] = (Number(activity[today]) || 0) + (totalXP - last);
        writeJSON(ACTIVITY_KEY, activity);
      }
      writeJSON(PROFILE_KEY, { lastXP: totalXP });
      return activity;
    }

    function calcStreak(activity) {
      const d = new Date();
      if (!(Number(activity[dateKey(d)]) > 0)) d.setDate(d.getDate() - 1);
      let streak = 0;
      while (Number(activity[dateKey(d)]) > 0) { streak++; d.setDate(d.getDate() - 1); }
      return streak;
    }

    function levelInfo(xp) {
      let level = Math.floor(Math.sqrt(xp / XP_PER_LEVEL_BASE)) + 1;
      const from = XP_PER_LEVEL_BASE * Math.pow(level - 1, 2);
      const to = XP_PER_LEVEL_BASE * Math.pow(level, 2);
      return { level, from, to, into: xp - from, span: to - from, left: to - xp, pct: Math.min(100, Math.max(0, ((xp - from) / (to - from)) * 100)) };
    }

    function buildBadges(totalXP, streak, level) {
      return [
        { ico: '🌱', name: 'Перші 10 XP', on: totalXP >= 10 },
        { ico: '⭐', name: '100 XP', on: totalXP >= 100 },
        { ico: '🏆', name: '500 XP', on: totalXP >= 500 },
        { ico: '🔥', name: '3 дні поспіль', on: streak >= 3 },
        { ico: '💪', name: '7 днів поспіль', on: streak >= 7 },
        { ico: '🚀', name: 'Рівень 5', on: level >= 5 }
      ];
    }

    function render() {
      const trainers = collectTrainers();
      const totalXP = trainers.reduce((s, t) => s + t.xp, 0);
      const activity = updateActivity(totalXP);
      const today = Number(activity[dateKey(new Date())]) || 0;
      const streak = calcStreak(activity);
      const lv = levelInfo(totalXP);

      document.getElementById('level-label').textContent = 'Рівень ' + lv.level;
      document.getElementById('level-xp').textContent = `${fmt(totalXP)} / ${fmt(lv.to)} XP`;
      document.getElementById('level-sub').textContent = `До наступного рівня: ${fmt(lv.left)} XP`;
      document.getElementById('level-bar').style.width = lv.pct + '%';

      document.getElementById('total-xp').textContent = fmt(totalXP);
      document.getElementById('streak').textContent = streak;
      document.getElementById('streak-unit').textContent = pluralDays(streak);
      document.getElementById('today-xp').textContent = fmt(today);
      document.getElementById('goal-xp').textContent = DAILY_GOAL;
      document.getElementById('goal-bar').style.width = Math.min(100, (today / DAILY_GOAL) * 100) + '%';

      const box = document.getElementById('trainers');
      box.textContent = '';
      if (!trainers.length) {
        const empty = document.createElement('div'); empty.className = 'empty'; empty.textContent = 'Поки що немає даних. Пройдіть перший тренажер!';
        box.appendChild(empty);
      } else {
        trainers.forEach(t => {
          const card = document.createElement('div'); card.className = 'stat-card';
          const h = document.createElement('h3'); h.textContent = t.name;
          const s = document.createElement('span'); s.textContent = fmt(t.xp) + ' XP';
          card.append(h, s); box.appendChild(card);
        });
      }

      const badgesBox = document.getElementById('badges'); badgesBox.textContent = '';
      buildBadges(totalXP, streak, lv.level).forEach(b => {
        const el = document.createElement('div'); el.className = 'badge' + (b.on ? ' on' : '');
        const i = document.createElement('span'); i.className = 'ico'; i.textContent = b.ico;
        el.append(i, document.createTextNode(b.name)); badgesBox.appendChild(el);
      });
    }

    async function doReset() {
      if (window.TPSync) { await TPSync.reset(); } else {
        Object.keys(localStorage).filter(k => k.startsWith(PREFIX)).forEach(k => localStorage.removeItem(k));
      }
      haptic('success'); render();
    }

    const STATUS_TEXT = {
      off: '⚠️ Хмара недоступна: прогрес тільки на цьому пристрої',
      syncing: '⏳ Синхронізація…',
      ok: '☁️ Прогрес збережено в акаунті Telegram',
      error: '⚠️ Не вдалося синхронізувати, спробуємо ще раз'
    };
    function showStatus(s) { document.getElementById('sync-status').textContent = STATUS_TEXT[s] || ''; }

    window.addEventListener('tpsync:status', e => showStatus(e.detail));
    window.addEventListener('tpsync:updated', () => render());

    document.getElementById('sync-btn').addEventListener('click', async () => {
      if (!window.TPSync) return;
      await TPSync.sync();
      render();
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      const msg = 'Скинути прогрес ВСІХ тренажерів? Цю дію не можна скасувати.';
      if (tg && tg.showConfirm) {
        tg.showConfirm(msg, ok => { if (ok) doReset(); });
      } else if (confirm(msg)) {
        doReset();
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) render();
    });

    renderUser();
    if (window.TPSync) {
      showStatus(TPSync.status);
      TPSync.ready.then(render);
    } else {
      showStatus('off');
      render();
    }
  </script>
</body>
</html>
