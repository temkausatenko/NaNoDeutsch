<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Топ-10</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg-color: var(--tg-theme-bg-color, #ffffff);
    --text-color: var(--tg-theme-text-color, #000000);
    --hint-color: var(--tg-theme-hint-color, #999999);
    --card-bg: var(--tg-theme-secondary-bg-color, #f1f1f1);
    --btn-color: var(--tg-theme-button-color, #2481cc);
    --nav-h: 70px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-color); color: var(--text-color); margin: 0;
    padding: 20px 20px calc(var(--nav-h) + var(--safe-bottom) + 20px) 20px;
  }
  h1 { font-size: 24px; margin-bottom: 5px; }
  p.sub { color: var(--hint-color); margin-top: 0; margin-bottom: 20px; font-size: 14px; }
  
  .list { display: flex; flex-direction: column; gap: 10px; }
  .user-card {
    display: flex; align-items: center; gap: 15px;
    background: var(--card-bg); padding: 12px 16px; border-radius: 16px;
  }
  .rank { font-size: 18px; font-weight: 800; width: 25px; text-align: center; color: var(--hint-color); }
  .rank.top1 { color: #fbbf24; font-size: 22px; }
  .rank.top2 { color: #94a3b8; font-size: 20px; }
  .rank.top3 { color: #b45309; font-size: 20px; }
  
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: #cbd5e1; object-fit: cover; }
  .name { flex-grow: 1; font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .xp { font-weight: 800; color: var(--btn-color); white-space: nowrap; }
  .empty { text-align: center; color: var(--hint-color); margin-top: 40px; font-size: 15px; }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: calc(var(--nav-h) + var(--safe-bottom)); padding-bottom: var(--safe-bottom);
    background-color: var(--bg-color); border-top: 1px solid rgba(128, 128, 128, 0.15);
    display: flex; justify-content: space-around; align-items: center;
  }
  .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--hint-color); text-decoration: none; font-size: 10px; font-weight: 600; gap: 4px; min-width: 70px; }
  .nav-item.active { color: var(--btn-color); }
  .nav-item svg { width: 24px; height: 24px; fill: currentColor; }
</style>
</head>
<body>

  <h1>Топ-10 учнів</h1>
  <p class="sub">Найкращі знавці німецької 🇩🇪</p>

  <div class="list" id="list">
    <div class="empty">Завантаження... ⏳</div>
  </div>

  <!-- Нижнее меню -->
  <nav class="bottom-nav" aria-label="Навігація">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M4 19h16v-2H4v2zm0-4h16v-2H4v2zm0-4h16v-2H4v2zm0-6v2h16V5H4z"/></svg>
      <span>Бібліотека</span>
    </a>
    <a href="leaderboard.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94.63 1.5 1.98 2.63 3.61 2.96V19H7v2h10v-2h-4v-3.1c1.63-.33 2.98-1.46 3.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z"/></svg>
      <span>Топ-10</span>
    </a>
    <a href="profile.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>Профіль</span>
    </a>
  </nav>

  <script>
    const PROJECT_ID = 'nanodeutsch'; // Ваш ID Firebase
    
    async function loadLeaderboard() {
      const listEl = document.getElementById('list');
      try {
        const url = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/leaderboard?orderBy=fields.xp%20desc&pageSize=10`;
        const res = await fetch(url);
        const data = await res.json();
        
        if (!data.documents || data.documents.length === 0) {
          listEl.innerHTML = '<div class="empty">Тут поки порожньо. Станьте першим!</div>';
          return;
        }

        listEl.innerHTML = '';
        data.documents.forEach((doc, index) => {
          const fields = doc.fields;
          const name = fields.name?.stringValue || 'Анонім';
          const xp = fields.xp?.integerValue || 0;
          const photo = fields.photo?.stringValue;
          
          const rankClass = index === 0 ? 'top1' : index === 1 ? 'top2' : index === 2 ? 'top3' : '';
          const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : (index + 1);
          
          const avatarHtml = photo 
            ? `<img src="${photo}" class="avatar" alt="">` 
            : `<div class="avatar" style="display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;background:var(--btn-color)">${name.charAt(0).toUpperCase()}</div>`;

          const card = document.createElement('div');
          card.className = 'user-card';
          card.innerHTML = `
            <div class="rank ${rankClass}">${medal}</div>
            ${avatarHtml}
            <div class="name">${name}</div>
            <div class="xp">${xp} XP</div>
          `;
          listEl.appendChild(card);
        });
      } catch (e) {
        console.error(e);
        listEl.innerHTML = '<div class="empty">Помилка завантаження. Спробуйте пізніше.</div>';
      }
    }

    window.Telegram.WebApp.expand();
    loadLeaderboard();
  </script>
</body>
</html>
