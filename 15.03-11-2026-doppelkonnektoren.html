<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Zweiteilige Konnektoren · тренажер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="sync.js"></script>
<script>
(function(){var T=['light','dark','autumn','winter','sakura','candy'],t=null;try{t=localStorage.getItem('pi-theme')}catch(e){}
document.documentElement.setAttribute('data-theme',T.indexOf(t)>-1?t:'dark');})();
</script>
<style>
:root{
  --bg:#0c0f16;--bg-grad:#1a2035;
  --card:#131a24;--card-hover:#1c2532;
  --tx:#e8eef5;--mu:#8892a7;
  --pr:#6366f1;--pr-glow:rgba(99,102,241,.35);
  --pl:#1e293b;
  --ok:#10b981;--okb:rgba(16,185,129,.12);
  --no:#ef4444;--nob:rgba(239,68,68,.12);
  --go:#f59e0b;--gob:rgba(245,158,11,.12);
  --bd:#1e293b;
  --sa:#818cf8;--pe:#a78bfa;
  --radius:16px;color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme]){
  --bg:#f8fafc;--bg-grad:#eef2ff;--card:#fff;--card-hover:#f1f5f9;
  --tx:#0f172a;--mu:#64748b;--pr:#4f46e5;--pr-glow:rgba(79,70,229,.2);--pl:#eef2ff;
  --ok:#059669;--okb:rgba(5,150,105,.1);--no:#dc2626;--nob:rgba(220,38,38,.1);
  --go:#d97706;--gob:rgba(217,119,6,.1);--bd:#e2e8f0;--sa:#6366f1;--pe:#7c3aed;color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f8fafc;--bg-grad:#eef2ff;--card:#fff;--card-hover:#f1f5f9;
  --tx:#0f172a;--mu:#64748b;--pr:#4f46e5;--pr-glow:rgba(79,70,229,.2);--pl:#eef2ff;
  --ok:#059669;--okb:rgba(5,150,105,.1);--no:#dc2626;--nob:rgba(220,38,38,.1);
  --go:#d97706;--gob:rgba(217,119,6,.1);--bd:#e2e8f0;--sa:#6366f1;--pe:#7c3aed;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}
button,.wc,.opt,.stg,.tab,.sent,.q{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.row input{font-size:16px!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(circle at top,var(--bg-grad) 0%,var(--bg) 100%);
  color:var(--tx);font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;transition:background-color .3s,color .3s}
.w{max-width:720px;margin:0 auto;padding-block:24px 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative}
.header-wrap{position:relative;text-align:center;margin-bottom:16px;padding-top:8px}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.5px;margin:0;
  background:linear-gradient(135deg,var(--sa),var(--pe));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.2}
h1 small{display:block;font-size:.72rem;font-weight:500;color:var(--mu);-webkit-text-fill-color:var(--mu);margin-top:6px;letter-spacing:.5px}
.theme-toggle,.sound-toggle,.fx-toggle{position:absolute;top:0;background:var(--card);border:1px solid var(--bd);
  color:var(--mu);border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;font-size:1.1rem;padding:0}
.theme-toggle{right:0}.sound-toggle{right:48px}.fx-toggle{right:96px}
.theme-toggle:hover,.sound-toggle:hover,.fx-toggle:hover{border-color:var(--pr);color:var(--tx);transform:scale(1.05)}
.tabs{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap;justify-content:center}
.tab{flex-shrink:0;border:1px solid var(--bd);background:transparent;color:var(--mu);border-radius:99px;
  padding:7px 14px;cursor:pointer;font-family:inherit;font-weight:500;font-size:.85rem;transition:all .2s ease;
  display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.tab small{font-weight:500;color:var(--mu);font-size:.7rem;padding:1px 7px;background:var(--pl);border-radius:99px;line-height:1.4}
.tab.on{background:var(--pr);border-color:var(--pr);color:#fff;box-shadow:0 2px 8px var(--pr-glow)}
.tab.on small{color:#fff;background:rgba(255,255,255,.2)}
.xp{margin-top:14px;padding:14px 18px 16px;border:1px solid transparent;border-radius:14px;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,rgba(245,158,11,.6),var(--bd) 38%,var(--bd) 62%,rgba(167,139,250,.45)) border-box;transition:box-shadow .5s}
.xp.max{box-shadow:0 0 0 1px rgba(245,158,11,.35),0 8px 28px rgba(245,158,11,.2)}
.xrst{margin-left:10px;width:24px;height:24px;padding:0;border:1px solid var(--bd);border-radius:50%;background:transparent;color:var(--mu);font-size:.85rem;line-height:1;cursor:pointer;transition:all .18s}
.xrst:hover{color:var(--tx);border-color:var(--pr)}
.xh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.xl{display:flex;align-items:center;gap:9px;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mu);font-weight:600}
.xg{display:block;width:9px;height:9px;transform:rotate(45deg);border-radius:2px;background:linear-gradient(135deg,#fcd34d,var(--go));box-shadow:0 0 9px rgba(245,158,11,.65)}
.xv{display:flex;align-items:baseline;gap:5px;font-variant-numeric:tabular-nums}
.xv b{font-size:1.35rem;line-height:1;font-weight:700;color:var(--tx)}
.xv small{font-size:.8rem;font-weight:600;color:var(--mu)}
.xp.max .xv b,.xp.max .xv small{color:var(--go)}
.xb{position:relative;height:12px;background:var(--pl);border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
.xb::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(20% - 2px),var(--card) calc(20% - 2px),var(--card) 20%)}
.xb i{position:relative;display:block;height:100%;width:0;overflow:hidden;border-radius:99px;background:linear-gradient(90deg,#b45309,var(--go) 55%,#fcd34d);transition:width .7s cubic-bezier(.4,0,.2,1)}
.xb i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%);transform:translateX(-100%);animation:xs 3.4s ease-in-out infinite}
@keyframes xs{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
.pg{margin:10px 0 14px;height:6px;background:var(--pl);border-radius:99px;overflow:hidden}
.pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sa),var(--pe));border-radius:99px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.stats-panel{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:18px}
.stat-box{background:var(--card);padding:10px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.stat-label{font-size:.66rem;text-transform:uppercase;letter-spacing:.5px;color:var(--mu);margin-bottom:2px;font-weight:600}
.stat-val{font-size:1.2rem;font-weight:800;color:var(--tx);line-height:1.1}
.stat-val.ok{color:var(--ok)}.stat-val.no{color:var(--no)}.stat-val.go{color:var(--go)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--radius);padding:22px;
  box-shadow:0 8px 30px rgba(0,0,0,.25);animation:slideUp .4s cubic-bezier(.16,1,.3,1) forwards;position:relative}
@keyframes slideUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(16,185,129,.4)}100%{box-shadow:0 0 0 18px rgba(16,185,129,0)}}
@keyframes pop{0%{transform:scale(.97);opacity:0}100%{transform:scale(1);opacity:1}}
.card.win{border-color:var(--ok);animation:glow .9s ease-out}
#finBox{display:none}
.card.fin > :not(.chead):not(#finBox){display:none!important}
.card.fin #finBox{display:block!important;text-align:center;padding:14px 4px 6px;animation:pop .35s ease-out}
#finBox .ft{font-size:1.3rem;font-weight:700;color:var(--ok);margin:0 0 10px}
#finBox .ft.rv{color:var(--pr)}
#finBox p{margin:0;color:var(--mu);font-size:.95rem;line-height:1.55}
#finBox p b{color:var(--tx)}
.fin-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.fin-actions button{padding:11px 20px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;transition:all .18s}
.fin-actions .go{border:1px solid var(--ok);background:var(--ok);color:#fff}
.fin-actions .go:hover{filter:brightness(1.1)}
.fin-actions .cancel{border:1px solid var(--bd);background:transparent;color:var(--tx)}
.fin-actions .cancel:hover{border-color:var(--pr)}
.tab.cl small::before{content:"✓ "}
.card h2{margin:0 0 16px;font-size:.66rem;font-weight:600;letter-spacing:.16em;color:var(--mu);padding-right:86px;text-transform:uppercase;line-height:32px;height:32px;}
.speak{position:absolute;top:22px;height:32px;width:32px;border-radius:50%;border:1px solid var(--bd);
  background:transparent;color:var(--mu);cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center;padding:0;line-height:1;z-index:2;font-size:1rem}
.speak{right:22px;}
.speak:hover{color:var(--tx);border-color:var(--pr)}
.sent,.q{font-size:1.2rem;font-weight:500;margin:0 0 8px;line-height:1.5;cursor:pointer;user-select:text;-webkit-tap-highlight-color:transparent;transition:opacity .15s}
.sent:hover{opacity:.85}.sent:active{opacity:.7}
.u{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:5px;text-decoration-color:var(--sa)}
.lab{margin:0 0 16px;font-size:1.15rem;line-height:1.4;font-weight:500;color:var(--tx)}
.lab:empty{display:none}
.tr-btn{font:inherit;font-size:.78rem;font-weight:500;color:var(--mu);background:transparent;border:1px dashed var(--bd);border-radius:99px;padding:4px 12px;cursor:pointer;transition:all .18s}
.tr-btn:hover{color:var(--tx);border-color:var(--pr)}
.tr-text{font-size:1rem;font-weight:500;line-height:1.5;color:var(--tx);opacity:.92;}
.tr-hint{font-size:.95rem;line-height:1.4;color:var(--go);font-style:normal;margin-top:10px;font-weight:500;background:var(--gob);padding:6px 12px;border-radius:8px;border-left:3px solid var(--go);display:inline-block;}
.rv-count{display:inline-block;margin-left:8px;padding:2px 11px;border-radius:99px;background:var(--pr);color:#fff;font-weight:700;font-size:.95em;letter-spacing:0;text-transform:none;vertical-align:middle;box-shadow:0 2px 8px var(--pr-glow)}
.rv-count i{font-style:normal;opacity:.7;font-weight:500;margin:0 2px}
.scheme{font-size:.95rem;color:var(--mu);margin:8px 0 0;line-height:1.5}
.scheme .np{color:var(--tx);font-weight:500}
.blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--sa);margin:0 4px;vertical-align:baseline;text-align:center;color:var(--sa);transition:all .3s}
.blank.ok{color:var(--ok);border-color:var(--ok)}.blank.no{color:var(--no);border-color:var(--no)}
.opts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.opt{flex:1 1 auto;min-height:44px;padding:11px 20px;font-size:1rem;text-align:center;
  border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font:inherit;font-weight:600;cursor:pointer;transition:all .2s}
.opt.ok,.opt.ok:hover{border-color:var(--ok);background:var(--okb);color:var(--ok)}
.opt.er,.opt.er:hover{border-color:var(--no);background:var(--nob);color:var(--no);animation:shake .4s}
.opt:disabled{cursor:default}.opt:disabled:not(.ok):not(.er){opacity:.45}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.row input{flex:1;min-width:0;padding:12px 16px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);
  font:inherit;font-size:1rem;outline:none;transition:border-color .2s}
.row input:focus{border-color:var(--pr);box-shadow:0 0 0 3px var(--pr-glow)}
.chk,.next{padding:12px 20px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s}
.chk{border:2px solid var(--pr);background:var(--pr);color:#fff}
.chk:hover{filter:brightness(1.1);box-shadow:0 4px 15px var(--pr-glow)}
.next{border:2px solid var(--bd);background:transparent;color:var(--tx)}.next:hover{border-color:var(--pr)}
.card:not(.mc) .opts{display:none}
.card.mc .row input,.card.mc .chk,.card.mc .um-row .um{display:none}
.card.mc .row .next{padding:12px 20px}
.card.mc .row{display:none}
.card.mc .fb{cursor:pointer}
.um-row{display:flex;gap:6px;margin-top:12px;align-items:center;flex-wrap:wrap}
.um{width:36px;height:34px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--mu);font-size:.95rem;cursor:pointer;transition:all .18s}
.um:hover{color:var(--tx);border-color:var(--pr)}
.tool{margin-left:auto;padding:6px 2px;border:0;background:none;color:var(--mu);font-size:.85rem;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;transition:color .15s}
.tool:hover{color:var(--tx)}

/* ===== КАТЕГОРІЇ (Stages) з temporale-konnektoren ===== */
.stages{display:grid;grid-auto-flow:column;grid-template-rows:auto;grid-auto-columns:max-content;gap:6px;overflow-x:auto;cursor:grab;padding:2px 2px 8px;margin:0 0 10px;scrollbar-width:none}
.stages::-webkit-scrollbar{display:none}
.stages.drag{cursor:grabbing;user-select:none}.stages.drag .stg{pointer-events:none}
.blank.wide{min-width:7em}

.stg{position:relative;flex:none;white-space:nowrap;border:1.5px solid var(--bd);background:transparent;color:var(--mu);border-radius:11px;padding:8px 13px 11px;font:inherit;font-size:.8rem;font-weight:600;line-height:1.2;cursor:pointer;overflow:hidden;transition:all .18s}
.stg small{margin-left:6px;font-size:.68rem;font-weight:500;opacity:.7}
.stg i{position:absolute;left:0;bottom:0;height:2.5px;background:var(--ok);transition:width .5s}
.stg:hover:not(.lk){color:var(--tx);border-color:var(--pr)}
.stg.on{border-color:var(--pr);background:var(--pr);color:#fff}
.stg.on small{opacity:.85}
.stg.on i{background:#fff}
.stg.lk{opacity:.5;cursor:pointer}

.lesson{display:none}body.lsn .lesson{display:block;margin:0 0 14px;padding:16px;border:1px solid var(--bd);border-radius:14px}
body.lsn #tabs,body.lsn #rule,body.lsn #card{display:none}
.ctl{position:absolute;top:22px;right:102px;display:flex;align-items:center;gap:6px;z-index:2}
.rulesbtn{height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--bd);background:transparent;color:var(--mu);font:inherit;font-size:.8rem;font-weight:600;white-space:nowrap;cursor:pointer;transition:all .18s}.rulesbtn:hover{color:var(--tx);border-color:var(--pr)}
.card h2#title{padding-right:290px}
@media(max-width:480px){.ctl{top:18px;right:98px}.card h2#title{padding-right:255px}}
.lesson h3{margin:0 0 8px;font-size:1.05rem}.lesson p{line-height:1.6;font-size:.92rem}.lesson .tip{padding:8px 12px;border-left:4px solid var(--go);background:var(--gob);border-radius:8px}
.lx{margin:10px 0}.lgo{margin-top:10px;padding:12px 20px;border:0;border-radius:12px;background:var(--pr);color:#fff;font-weight:700;cursor:pointer;font-family:inherit}
.lsl{display:inline-block;margin-top:4px;cursor:pointer;color:var(--mu);font-size:.72rem;transition:color .15s}
.lsl:hover{color:var(--tx)}
.rule{margin:0 0 12px;padding:9px 14px;border:1px solid color-mix(in srgb,var(--go) 22%,transparent);border-left:3px solid var(--go);border-radius:12px;background:linear-gradient(90deg,var(--gob),transparent 85%);color:var(--tx);font-size:.84rem;line-height:1.55}
.rule:empty{display:none}
.rule b{font-weight:700}
.sch{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fb .why{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--nob);font-size:.86rem;line-height:1.5}
.fb{margin-top:18px;padding:14px 16px;border-radius:10px;border-left:4px solid;display:none;animation:pop .4s ease}
.fb.ok{display:block;background:var(--okb);border-color:var(--ok)}
.fb.er{display:block;background:var(--nob);border-color:var(--no);animation:shake .4s}
.fb.hint{display:block;background:var(--gob);border-color:var(--go)}
.fb .k{font-size:.66rem;letter-spacing:.16em;font-weight:700}
.fb.ok .k{color:var(--ok)}.fb.er .k{color:var(--no)}.fb.hint .k{color:var(--go)}
.fb .ans{font-size:1.1rem;font-weight:500;margin:6px 0 4px;cursor:pointer;user-select:none;display:inline-block}
.fb .ans:hover{text-decoration:underline;text-underline-offset:4px}
.fb .ans::after{content:" 🔊";font-size:.8em;opacity:.6}
.fb .ex{color:var(--mu);font-size:.88rem;margin-top:4px}
.fb .bar{height:2px;background:var(--ok);border-radius:2px;margin-top:12px;animation:shrink 2.2s linear forwards;width:100%}
@keyframes shrink{to{width:0}}
.foot{display:flex;flex-direction:column;align-items:center;justify-content:center;margin-top:24px;width:100%}
.foot-row{display:flex;gap:10px;justify-content:center;width:100%;flex-wrap:wrap;margin-bottom:12px}
.btn{font:inherit;font-weight:600;border-radius:10px;padding:9px 16px;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);transition:all .2s;font-size:.85rem}
.btn:hover{border-color:var(--pr);transform:translateY(-1px)}
.btn.g{font-weight:500;font-size:.82rem;padding:8px 14px;color:var(--mu);border-color:transparent;background:transparent}
.btn.g:hover{color:var(--tx);background:var(--pl);transform:none}
.btn.danger{background:var(--nob);color:var(--no);border-color:var(--no)}
.btn.p{background:var(--pr);border-color:var(--pr);color:#fff}
.btn.p:hover{filter:brightness(1.1);box-shadow:0 4px 15px var(--pr-glow)}
.theory-btn{width:100%;padding:14px;font-size:1rem;margin-top:4px}
.cheat{margin:24px 0;padding:16px 18px;background:var(--card);border:1px solid var(--bd);border-radius:var(--radius);box-shadow:0 8px 30px rgba(0,0,0,.18)}
.cheat-title{margin:0 0 2px;font-size:1.05rem;font-weight:700;color:var(--tx)}
.cheat-sub{margin:0 0 12px;font-size:.78rem;color:var(--mu)}
.cheat-pills{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.cheat-pill{font:inherit;font-size:.8rem;font-weight:500;color:var(--mu);background:transparent;border:1px solid var(--bd);border-radius:99px;padding:5px 12px;cursor:pointer;transition:all .15s}
.cheat-pill:hover{color:var(--tx);border-color:var(--c,var(--sa))}
.cheat-pill.on{color:var(--tx);border-color:var(--c,var(--sa));background:var(--pl);box-shadow:inset 0 -2px 0 var(--c,var(--sa))}
.cheat-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:22px}
.cheat-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:7px 2px;border-bottom:1px solid var(--bd)}
.cheat-row b{font-size:.88rem;font-weight:600;color:var(--tx);line-height:1.35}
.cheat-row span{font-size:.76rem;color:var(--mu);text-align:right;line-height:1.35}
@media(max-width:480px){
  .stages{gap:6px}
  .stg{padding:8px 11px 12px;font-size:.8rem;min-height:38px;gap:5px}
  .stg small{font-size:.66rem}
}
@media(max-width:360px){
  .stg{font-size:.76rem;padding:7px 10px 11px}
}
@media(max-width:480px){.cheat{padding:14px}.cheat-list{grid-template-columns:1fr}}
.complete{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:100;
  padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  animation:pop .35s ease}
.complete-card{background:var(--card);border:1px solid var(--ok);border-radius:16px;padding:28px 24px;

["Je mehr du übst, desto schneller kannst du eine Fremdsprache lernen.","Чим більше ти практикуєшся, тим швидше можеш вивчити іноземну мову.","Je","desto","mehr übst, schneller lernen"],
["Je früher man sich bewirbt, desto besser sind die Chancen auf einen Job.","Чим раніше подаєшся, тим кращі шанси отримати роботу.","Je","desto","früher bewirbt, Chancen besser sind"],
["Je mehr du dich bemühst, desto mehr kannst du erreichen.","Чим більше ти стараєшся, тим більше можеш досягти.","Je","desto","mehr bemühst, mehr erreichen"]]],
["en","entweder … oder","<div class='lm'><b>entweder … oder</b> — або… або…</div><div class='rf'><span class='k'>entweder</span> A <span class='k'>oder</span> B</div><div class='lr'>• Обидві частини рівноправні: <i>Er liest entweder Stellenanzeigen oder er geht zur Agentur.</i></div><div class='lr'>• Якщо речення починається з <b>Entweder</b>, дієслово йде одразу після нього: <i>Entweder liest er …, oder er geht …</i></div><div class='lr'>• Після <b>oder</b> порядок слів прямий.</div><div class='lr'>• Кома перед <b>oder</b> у простих випадках не потрібна.</div><div class='lr lex'>Ще приклад: <i>In der Pause trinke ich entweder Kaffee oder Tee.</i></div>",[
["In der Pause trinke ich entweder Kaffee oder Tee.","У перерву я п’ю або каву, або чай.","entweder","oder","Kaffee, Tee trinke"],
["Beim neuen Standort muss man entweder pendeln oder umziehen.","На новому місці треба або їздити, або переїжджати.","entweder","oder","pendeln, umziehen"],
["Entweder liest er Stellenanzeigen oder er geht zur Agentur für Arbeit.","Або він читає оголошення, або йде в агентство з працевлаштування.","Entweder","oder","Stellenanzeigen liest, Agentur geht"],
["Entweder bekomme ich endlich eine Gehaltserhöhung oder ich suche mir eine neue Stelle.","Або я нарешті отримаю підвищення зарплати, або шукатиму нову роботу.","Entweder","oder","Gehaltserhöhung bekomme, neue Stelle suche"],
["Die Praxis sucht momentan entweder zwei Auszubildende oder eine Ärztin in Teilzeit.","Практика наразі шукає або двох стажистів, або лікарку на неповний робочий день.","entweder","oder","zwei Auszubildende, Ärztin sucht"],
["Arbeitssuchende informieren sich über Stellenangebote entweder selbst im Internet oder sie nutzen die Hilfe der Agentur für Arbeit.","Шукачі роботи дізнаються про вакансії або самі в інтернеті, або користуються допомогою агентства з працевлаштування.","entweder","oder","im Internet informieren, Hilfe nutzen"],
["Du musst dich entweder heute oder morgen bei der Firma melden.","Ти повинен зв'язатися з фірмою або сьогодні, або завтра.","entweder","oder","heute, morgen melden"],
["Man kann entweder mit dem Bus fahren oder ein Taxi nehmen.","Можна поїхати або автобусом, або взяти таксі.","entweder","oder","Bus fahren, Taxi nehmen"],
["Wir müssen entweder den Termin verschieben oder einen anderen Raum suchen.","Ми повинні або перенести зустріч, або знайти іншу кімнату.","entweder","oder","Termin verschieben, anderen Raum suchen"]]],
["we","weder … noch","<div class='lm'><b>weder … noch</b> — ні… ні…</div><div class='rf'><span class='k'>weder</span> A <span class='k'>noch</span> B</div><div class='lr'>• Це вже заперечення: <b>nicht</b> і <b>kein</b> не потрібні.</div><div class='lr'>• Коми між частинами немає.</div><div class='lr'>• Найприродніше сполучати однакові елементи: <b>weder</b> A <b>noch</b> A.</div><div class='lr'>• Два підмети: дієслово зазвичай узгоджується з найближчим — <i>Weder der Chef noch der Kollege kommt.</i> / <i>…die Kollegen kommen.</i></div><div class='lr lex'>Ще приклад: <i>Ich bekomme weder Urlaubsgeld noch Weihnachtsgeld.</i></div>",[
["Ich bekomme weder Urlaubsgeld noch Weihnachtsgeld.","Я не отримую ні відпускних, ні різдвяних виплат.","weder","noch","Urlaubsgeld, Weihnachtsgeld bekomme"],
["Hoffentlich bekomme ich weder Erkältung noch Fieber.","Сподіваюся, я не захворію ні на застуду, ні на температуру.","weder","noch","Erkältung, Fieber bekomme"],
["Ich trinke weder Kaffee noch Tee.","Я не п’ю ні каву, ні чай.","weder","noch","Kaffee, Tee trinke"],
["Daniel will weder Überstunden machen noch am Wochenende arbeiten.","Даніель не хоче ні працювати понаднормо, ні працювати у вихідні.","weder","noch","Überstunden machen, am Wochenende arbeiten"],
["Er arbeitet weder im Homeoffice noch im Büro.","Він працює ні вдома, ні в офісі.","weder","noch","im Homeoffice, im Büro arbeitet"],
["Bruno hat weder über das Jobcenter noch über eine Zeitarbeitsfirma einen Job gefunden.","Бруно не знайшов роботу ні через центр зайнятості, ні через агентство тимчасового працевлаштування.","weder","noch","Jobcenter, Zeitarbeitsfirma gefunden"],
["Tom ist gerade arbeitslos, deshalb kann er jetzt weder in den Urlaub fahren noch sich ein neues Auto leisten.","Том зараз безробітний, тому не може ні поїхати у відпустку, ні дозволити собі нову машину.","weder","noch","in Urlaub fahren, neues Auto leisten"],
["Ich kann weder heute noch morgen zum Meeting kommen.","Я не можу прийти на зустріч ні сьогодні, ні завтра.","weder","noch","heute, morgen kommen"],
["Du darfst weder hier rauchen noch Alkohol trinken.","Тобі не можна ні курити тут, ні пити алкоголь.","weder","noch","rauchen, Alkohol trinken"],
["Sie will weder länger warten noch mehr Geld ausgeben.","Вона не хоче ні довше чекати, ні витрачати більше грошей.","weder","noch","länger warten, mehr Geld ausgeben"]]],
["nn","nicht nur … sondern auch","<div class='lm'><b>nicht nur … sondern auch</b> — не лише… а й…</div><div class='rf'><span class='k'>nicht nur</span> A, <span class='k'>sondern auch</span> B</div><div class='lr'>• Ставить <b>акцент на другій частині</b> (на відміну від нейтрального sowohl … als auch).</div><div class='lr'>• Кома перед <b>sondern</b> обов’язкова.</div><div class='lr'>• Після <b>sondern auch</b> інверсії немає.</div><div class='lr'>• Якщо далі ціле речення, підмет стоїть перед дієсловом: <i>…, sondern ich mache auch Notizen.</i></div><div class='lr lex'>Ще приклад: <i>Ich lerne nicht nur Deutsch, sondern auch Englisch.</i></div>",[
["Ich lerne nicht nur Deutsch, sondern auch Englisch.","Я вивчаю не тільки німецьку, а й англійську.","nicht nur","sondern auch","Deutsch, Englisch lerne"],
["Bei einem Praktikum sammelt man nicht nur Berufserfahrung, sondern auch Kontakte.","На практиці здобувають не лише досвід, а й контакти.","nicht nur","sondern auch","Berufserfahrung, Kontakte sammelt"],
["Man sollte nicht nur über sich sprechen, sondern auch Interesse am Unternehmen zeigen.","Не варто говорити лише про себе, а й проявляти інтерес до компанії.","nicht nur","sondern auch","über sich sprechen, Interesse zeigen"],
["Bei Bewerbungen ist nicht nur der Lebenslauf wichtig, sondern auch das Anschreiben.","У заявках важливе не лише резюме, а й супровідний лист.","nicht nur","sondern auch","Lebenslauf, Anschreiben wichtig"],
["Ich höre nicht nur die Nachrichten, sondern mache mir dabei auch Notizen.","Я не лише слухаю новини, а й роблю при цьому нотатки.","nicht nur","sondern","Nachrichten höre, Notizen mache"],
["Er wechselte nicht nur zu einer neuen Firma, sondern zog auch in eine andere Stadt.","Він не лише перейшов до нової фірми, а й переїхав в інше місто.","nicht nur","sondern","neuen Firma wechselte, andere Stadt zog"],
["Im Vorstellungsgespräch zählt nicht nur die Qualifikation, sondern auch der persönliche Eindruck.","На співбесіді важлива не лише кваліфікація, а й особисте враження.","nicht nur","sondern auch","Qualifikation, Eindruck zählt"],
["Man muss nicht nur die Theorie kennen, sondern auch praktisch üben.","Треба не лише знати теорію, а й практично тренуватися.","nicht nur","sondern auch","Theorie kennen, praktisch üben"],
["Du solltest nicht nur ans Geld denken, sondern auch an deine Gesundheit.","Тобі варто думати не лише про гроші, а й про здоров'я.","nicht nur","sondern auch","ans Geld denken, an Gesundheit denken"],
["Sie kann nicht nur gut kochen, sondern auch sehr schön singen.","Вона не лише добре готує, а й дуже гарно співає.","nicht nur","sondern auch","gut kochen, sehr schön singen"]]],
["so","sowohl … als auch","<div class='lm'><b>sowohl … als auch</b> — як… так і…</div><div class='rf'><span class='k'>sowohl</span> A <span class='k'>als auch</span> B</div><div class='lr'>• Нейтральне додавання, <b>без акценту</b> (на відміну від nicht nur … sondern auch).</div><div class='lr'>• Коми перед <b>als auch</b> немає.</div><div class='lr'>• Підмет з цією парою — у множині: <i>Sowohl der Lebenslauf als auch das Anschreiben sind wichtig.</i></div><div class='lr lex'>Ще приклад: <i>Ich lerne sowohl Deutsch als auch Englisch.</i></div>",[
["Ich lerne sowohl Deutsch als auch Englisch.","Я вивчаю як німецьку, так і англійську.","sowohl","als auch","Deutsch, Englisch lerne"],
["Er hat sowohl in einer Kantine gearbeitet als auch abends Büroräume gereinigt.","Він і працював у їдальні, і ввечері прибирав офіси.","sowohl","als auch","in Kantine gearbeitet, Büroräume gereinigt"],
["Man bewirbt sich sowohl per Mail als auch über Online-Formulare.","Подаються як поштою, так і через онлайн-форми.","sowohl","als auch","per Mail, über Online-Formulare bewirbt"],
["Bei einer Bewerbung sind sowohl der Lebenslauf als auch das Anschreiben wichtig.","Для заявки важливі і резюме, і супровідний лист.","sowohl","als auch","Lebenslauf, Anschreiben wichtig"],
["Ich habe sowohl mein Profil aktuell gehalten als auch in sozialen Netzwerken nach Stellen gesucht.","Я і підтримував свій профіль в актуальному стані, і шукав роботу в соціальних мережах.","sowohl","als auch","Profil aktuell gehalten, in Netzwerken nach Stellen gesucht"],
["Du solltest sowohl gern im Team arbeiten als auch flexible Arbeitszeiten akzeptieren.","Ти маєш і любити працювати в команді, і погоджуватися на гнучкий графік.","sowohl","als auch","im Team arbeiten, flexible Arbeitszeiten akzeptieren"],
["Man muss sowohl Deutsch als auch Englisch sprechen können.","Треба вміти говорити як німецькою, так і англійською.","sowohl","als auch","Deutsch, Englisch sprechen können"],
["Du kannst sowohl im Büro als auch zu Hause arbeiten.","Ти можеш працювати як в офісі, так і вдома.","sowohl","als auch","im Büro, zu Hause arbeiten"],
["Er will sowohl mehr Geld verdienen als auch mehr Freizeit haben.","Він хоче як більше заробляти, так і мати більше вільного часу.","sowohl","als auch","mehr Geld verdienen, mehr Freizeit haben"]]],
["zw","zwar … aber","<div class='lm'><b>zwar … aber</b> — хоч і… але…</div><div class='rf'><span class='k'>zwar</span> A, <span class='k'>aber</span> B</div><div class='lr'>• Друга частина протиставляється першій.</div><div class='lr'>• Кома перед <b>aber</b> обов’язкова.</div><div class='lr'>• <b>aber</b> стоїть «на нулі»: порядок слів далі прямий (підмет, потім дієслово).</div><div class='lr lex'>Ще приклад: <i>Ich bin zwar müde, aber ich gehe trotzdem zur Arbeit.</i></div>",[
["Ich bin zwar müde, aber ich gehe trotzdem zur Arbeit.","Я хоч і втомився, але все одно йду на роботу.","zwar","aber","müde bin, zur Arbeit gehe"],
["Sie nimmt zwar an den Meetings teil, aber sie sagt nie etwas.","Вона хоч і бере участь у нарадах, але ніколи нічого не каже.","zwar","aber","an Meetings teilnimmt, nie etwas sagt"],
["Melina hat zwar eine Ausbildung als Reiseverkehrskauffrau gemacht, aber jetzt arbeitet sie als Texterin.","Меліна хоч і здобула фах турагентки, але тепер працює копірайтеркою.","zwar","aber","Ausbildung gemacht, als Texterin arbeitet"],
["Selina will zwar Karriere machen, aber sie will auch Zeit für ihre Familie haben.","Селіна хоч і хоче робити кар’єру, але хоче мати час і для родини.","zwar","aber","Karriere machen, Zeit für Familie haben"],
["Um schneller einen Arbeitsplatz zu finden, muss man sich zwar bei der Agentur für Arbeit melden, aber man kann auch parallel im Internet recherchieren.","Щоб швидше знайти роботу, потрібно звернутися до агентства з працевлаштування, але можна також паралельно шукати в інтернеті.","zwar","aber","bei Agentur melden, im Internet recherchieren"],
["Martha findet ihre Arbeit zwar langweilig, aber das Gehalt ist wirklich gut.","Марта вважає свою роботу нудною, але зарплата справді хороша.","zwar","aber","Arbeit langweilig, Gehalt gut"],
["Du kannst zwar heute länger arbeiten, aber morgen musst du früher anfangen.","Ти хоч і можеш сьогодні працювати довше, але завтра мусиш почати раніше.","zwar","aber","heute länger arbeiten, morgen früher anfangen"],
["Ich will zwar mitkommen, aber ich kann leider nicht.","Я хоч і хочу піти з вами, але, на жаль, не можу.","zwar","aber","mitkommen will, leider nicht kann"],
["Sie darf zwar im Homeoffice arbeiten, aber sie muss trotzdem erreichbar sein.","Їй хоч і можна працювати вдома, але вона все одно має бути на зв'язку.","zwar","aber","im Homeoffice arbeiten, erreichbar sein"],
["Ich habe zwar nicht viel Zeit, aber ich helfe dir trotzdem.","Я хоч і не маю багато часу, але все одно допоможу тобі.","zwar","aber","nicht viel Zeit, helfe trotzdem"]]],
["ei","einerseits … andererseits","<div class='lm'><b>einerseits … andererseits</b> — з одного боку… з іншого…</div><div class='rf'><span class='k'>einerseits</span> A, <span class='k'>andererseits</span> B</div><div class='lr'>• Між частинами стоїть кома.</div><div class='lr'>• На початку речення — інверсія: <i>Einerseits möchte ich reisen, …</i></div><div class='lr'>• Може стояти і всередині: <i>Sie möchte einerseits …, andererseits …</i></div><div class='lr lex'>Ще приклад: <i>Einerseits möchte ich reisen, andererseits muss ich Geld sparen.</i></div>",[
["Einerseits möchte ich reisen, andererseits muss ich Geld sparen.","З одного боку, я хочу подорожувати, з іншого — мушу заощаджувати.","Einerseits","andererseits","reisen möchte, Geld sparen muss"],
["Einerseits bereitet mir mein Job Freude, andererseits verdiene ich nicht so viel.","З одного боку, робота мені подобається, з іншого — заробляю небагато.","Einerseits","andererseits","Job Freude bereitet, nicht so viel verdiene"],
["Sie möchte einerseits mehr Geld verdienen, andererseits mag sie ihren Job.","З одного боку, вона хоче заробляти більше, з іншого — їй подобається її робота.","einerseits","andererseits","mehr Geld verdienen, Job mag"],
["Helena möchte einerseits mit Menschen arbeiten, andererseits interessiert sie sich für Technik.","З одного боку, Гелена хоче працювати з людьми, з іншого — її цікавить техніка.","einerseits","andererseits","mit Menschen arbeiten, für Technik interessiert"],
["Einerseits macht das Unternehmen im Moment große Gewinne, andererseits gibt es keine Gehaltserhöhungen für die Mitarbeiter.","З одного боку, компанія зараз отримує великі прибутки, з іншого — підвищення зарплат для працівників немає.","Einerseits","andererseits","große Gewinne macht, keine Gehaltserhöhungen gibt"],
["Einerseits will ich mehr Geld verdienen, andererseits möchte ich weniger arbeiten.","З одного боку, я хочу більше заробляти, з іншого — хочу менше працювати.","Einerseits","andererseits","mehr Geld verdienen, weniger arbeiten"],
["Einerseits kann man im Homeoffice flexibel arbeiten, andererseits muss man ständig erreichbar sein.","З одного боку, вдома можна працювати гнучко, з іншого — треба постійно бути на зв'язку.","Einerseits","andererseits","flexibel arbeiten, ständig erreichbar sein"],
["Man sollte einerseits ehrlich sein, andererseits darf man niemanden verletzen.","З одного боку, треба бути чесним, з іншого — не можна нікого ображати.","einerseits","andererseits","ehrlich sein, niemanden verletzen"]]],
["tl","teils … teils","<div class='lm'><b>teils … teils</b> — почасти… почасти…</div><div class='rf'><span class='k'>teils</span> A, <span class='k'>teils</span> B</div><div class='lr'>• «Трохи одне, трохи інше»: обидві частини правдиві водночас.</div><div class='lr'>• Між частинами стоїть кома.</div><div class='lr'>• Зазвичай поєднує однакові елементи: <i>teils zum Telefonieren, teils als Internetzugang</i>.</div><div class='lr lex'>Ще приклад: <i>Ich arbeite teils im Büro, teils im Homeoffice.</i></div>",[
["Ich arbeite teils im Büro, teils im Homeoffice.","Я працюю почасти в офісі, почасти вдома.","teils","teils","im Büro arbeite, im Homeoffice"],
["Mein Job ist teils anstrengend, teils sehr entspannt.","Моя робота почасти виснажлива, почасти дуже спокійна.","teils","teils","anstrengend, sehr entspannt"],
["Viele Menschen benutzen ihr Smartphone teils zum Telefonieren, teils als mobilen Internetzugang.","Багато людей користуються смартфоном почасти для дзвінків, почасти як мобільним доступом до інтернету.","teils","teils","zum Telefonieren, als Internetzugang"],
["Die Gerichte sind teils mit Knoblauch, teils mit frischen Kräutern gewürzt.","Страви приправлені почасти часником, почасти свіжими травами.","teils","teils","mit Knoblauch, mit frischen Kräutern gewürzt"],
["Das Wetter war teils sonnig, teils bewölkt.","Погода була почасти сонячною, почасти хмарною.","teils","teils","sonnig, bewölkt"],
["Der Film war teils lustig, teils traurig.","Фільм був почасти смішним, почасти сумним.","teils","teils","lustig, traurig"],
["Die Kollegen kommen teils aus Deutschland, teils aus dem Ausland.","Колеги родом почасти з Німеччини, почасти з-за кордону.","teils","teils","aus Deutschland, aus dem Ausland kommen"],
["Ich habe teils Lust, teils Angst, ins Ausland zu gehen.","Я почасти хочу, почасти боюся їхати за кордон.","teils","teils","Lust haben, Angst haben"]]],
["as","auf der einen Seite … auf der anderen Seite","<div class='lm'><b>auf der einen Seite … auf der anderen Seite</b> — з одного боку… з іншого…</div><div class='rf'><span class='k'>auf der einen Seite</span> A, <span class='k'>auf der anderen Seite</span> B</div><div class='lr'>• Те саме, що <b>einerseits … andererseits</b>, лише довша форма.</div><div class='lr'>• Між частинами стоїть кома.</div><div class='lr'>• На початку речення — інверсія: <i>Auf der einen Seite kann ich …</i></div><div class='lr lex'>Ще приклад: <i>Auf der einen Seite verdiene ich gut, auf der anderen Seite habe ich wenig Freizeit.</i></div>",[
["Auf der einen Seite kann ich meine Katze tagsüber allein lassen, auf der anderen Seite zerkratzt sie meine Möbel.","З одного боку, я можу залишати кішку саму на день, з іншого — вона дряпає мої меблі.","Auf der einen Seite","auf der anderen Seite","Katze allein lassen kann, Möbel zerkratzt"],

function gapped(x,fill){let s=esc(x[0]);const g=(c)=>"<span class='blank"+(fill?" fill ok":"")+"'>"+(fill?esc(c):"&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;")+"</span>";
 return s.replace(x[2],"\u0001").replace(x[3],"\u0002").replace("\u0001",g(x[2])).replace("\u0002",g(x[3]))}
const norm=s=>s.toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[.,!?;:„“"']/g,"").replace(/\s+/g," ").trim();

const osa=(a,b)=>{const m=a.length,n=b.length,d=[];for(let i=0;i<=m;i++){d[i]=[i];for(let j=1;j<=n;j++)d[i][j]=i?0:j}
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){const c=a[i-1]===b[j-1]?0:1;d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}
  return d[m][n]};
const typoOk=(v,a,x)=>{const nv=norm(v),na=norm(a),tol=na.length>=55?2:1;
  if(osa(nv,na)>tol) return false;
  return [x[2],x[3]].every(c=>(" "+nv+" ").includes(" "+norm(String(c))+" "))};
const altsOf=a=>{const r=[a];if(/\bdesto\b/.test(a))r.push(a.replace(/\bdesto\b/g,"umso"));if(/\bumso\b/.test(a))r.push(a.replace(/\bumso\b/g,"desto"));return r};
const commaSig=t=>t.replace(/\s*,\s*oder\b/gi," oder").replace(/\s*,\s*/g,", ").replace(/[.!?;:„“"']/g,"").trim().split(/\s+/).map(w=>/,$/.test(w)?1:0).join("");

function explainTy(x,v){
  const key=P[tab][0];
  const wrap=L=>L.length?"<div class='why'><b>🔍 Що не так</b>"+L.map(t=>"<div>• "+t+"</div>").join("")+"</div>":"";
  if(!v||!v.trim()) return wrap(["Ти відкрив відповідь без спроби. Знайди в реченні пару <b>"+esc(x[5])+"</b> і зверни увагу на порядок слів. Це речення ще повернеться."]);
  const raw=t=>t.replace(/[.,!?;:„“"']/g,"").split(/\s+/).filter(Boolean);
  const nv=norm(v),al=altsOf(x[0]);
  const a=al[0],nz=w=>w==="umso"?"desto":w;
  const ct=raw(a),cn=ct.map(t=>nz(norm(t))),ut=raw(v),un=ut.map(t=>nz(norm(t))),L=[];
  const c1={};un.forEach(w=>{c1[w]=(c1[w]||0)+1});
  let miss=[];cn.forEach((w,i)=>{if(c1[w]>0)c1[w]--;else miss.push(ct[i])});
  const c2={};cn.forEach(w=>{c2[w]=(c2[w]||0)+1});
  let extra=[];un.forEach((w,i)=>{if(c2[w]>0)c2[w]--;else extra.push(ut[i])});
  const ml=[x[2],x[3]].filter(c=>{const k=norm(String(c)),has=z=>(" "+nv+" ").includes(" "+z+" ");return !(has(k)||(k==="desto"&&has("umso")))});
  if(ml.length===2) L.push("У твоїй відповіді немає пари <b>"+esc(x[5])+"</b>, а саме вона тут потрібна.");
  else if(ml.length===1) L.push("Не вистачає частини <b>«"+esc(ml[0])+"»</b> з пари <b>"+esc(x[5])+"</b>.");
  const sp=[];
  for(let i=miss.length-1;i>=0;i--){
    const m=norm(miss[i]); if(m.length<5) continue;
    const j=extra.findIndex(e=>osa(norm(e),m)<=Math.max(1,Math.floor(m.length/4)));
    if(j>=0){sp.push([extra[j],miss[i]]);extra.splice(j,1);miss.splice(i,1)}
  }
  sp.reverse().forEach(q=>L.push("Орфографія: ти написав <b>"+esc(q[0])+"</b>, а треба <b>"+esc(q[1])+"</b>."));
  if(key==="we"){
    const ng=extra.filter(w=>/^(nicht|kein\w*)$/.test(norm(w)));
    if(ng.length){L.push("<b>weder … noch</b> — це вже заперечення, тому <b>nicht</b> і <b>kein</b> не потрібні.");extra=extra.filter(w=>!ng.includes(w))}
